name: Backend

on:
  workflow_dispatch:
  push:
    paths: ["truyen/backend/**", "database/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["truyen/backend/**", "database/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: truyen/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B test
